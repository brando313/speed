<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hockey Speed Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1015; --panel:#141C25; --stage:#1A242F;
  --ink:#EEF4FA; --dim:#93A5B6; --faint:#4A5B6B;
  --blue:#4D9BFF; --red:#FF3B4E; --green:#31D07A;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.disp{font-family:"Archivo",system-ui,sans-serif;letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#top{
  display:flex;align-items:center;gap:12px;padding:14px 20px 10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));flex:0 0 auto;
}
#block{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--red);font-weight:600;
}
#count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim)}
#done-badge{
  display:none;align-items:center;gap:5px;color:var(--green);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;font-weight:600;
}
#done-badge.on{display:flex}

/* ---------- main ---------- */
#main{flex:1 1 auto;min-height:0;display:grid;gap:16px;padding:0 20px 8px;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
@media (max-aspect-ratio:1/1){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr)}
}
#stage{
  background:var(--stage);border-radius:14px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:0;
}
#stage svg{width:100%;height:100%;display:block}
#replay{
  position:absolute;right:10px;bottom:10px;background:rgba(11,16,21,.72);color:var(--dim);
  border:1px solid var(--faint);border-radius:9px;padding:8px 12px;font-size:11px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;
}
#info{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
#info::-webkit-scrollbar{width:0}

h1{font-family:"Archivo";font-weight:900;font-size:clamp(24px,3.4vw,36px);
   line-height:1;text-transform:uppercase;margin:0 0 8px}
#plain{color:var(--dim);font-size:15px;line-height:1.45;margin:0 0 16px}

.sec{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
     text-transform:uppercase;color:var(--faint);font-weight:600;margin:16px 0 7px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:11px;margin:0 0 9px;font-size:15px;line-height:1.4}
ol.steps li:before{
  content:counter(s);flex:0 0 auto;width:21px;height:21px;border-radius:50%;
  background:var(--red);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
ul.checks{margin:0;padding:0;list-style:none}
ul.checks li{display:flex;gap:10px;font-size:14.5px;line-height:1.4;margin:0 0 7px;color:var(--ink)}
ul.checks li:before{content:"";flex:0 0 auto;width:8px;height:8px;margin-top:7px;
  border-radius:2px;background:var(--green)}
#fix{border-left:3px solid var(--red);padding:2px 0 2px 12px;margin:14px 0 4px;
  font-size:14.5px;font-style:italic;line-height:1.4;color:var(--dim)}

/* ---------- dose + sets ---------- */
#dosebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--panel);border-radius:14px;padding:14px 16px;margin:0 0 4px}
#big{font-family:"Archivo";font-weight:900;font-size:30px;line-height:1;white-space:nowrap}
#sub{font-size:12.5px;color:var(--dim);line-height:1.3;flex:1 1 120px;min-width:110px}
#dots{display:flex;gap:9px;margin-left:auto}
.dot{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--faint);
  background:transparent;color:var(--faint);font-family:"IBM Plex Mono",monospace;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,background .12s ease,border-color .12s ease;
}
.dot:active{transform:scale(.9)}
.dot.on{background:var(--green);border-color:var(--green);color:#06210F}
#restbtn{
  border:2px solid var(--blue);color:var(--blue);background:transparent;border-radius:10px;
  padding:9px 14px;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  letter-spacing:.06em;white-space:nowrap;
}
#restbtn.run{background:var(--blue);color:#04121F}
#restbtn.hide{display:none}

/* ---------- bottom ---------- */
#bot{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:12px 20px calc(14px + var(--safe-b));border-top:1px solid #1E2833}
.nav{
  width:52px;height:52px;flex:0 0 auto;border-radius:13px;border:1px solid #2A3644;
  background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;
}
.nav:disabled{opacity:.3}
.nav:active{background:#1C2732}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
#prog{flex:1 1 auto;min-width:0}
#segs{display:flex;gap:3px;height:9px}
.seg{flex:1 1 0;border-radius:2px;background:#242F3B;transition:background .2s ease}
.seg.done{background:var(--green)}
.seg.cur{background:var(--red)}
#progtxt{display:flex;justify-content:space-between;margin-top:7px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.06em}
#nextbtn{
  height:52px;flex:0 0 auto;padding:0 20px;border-radius:13px;border:0;background:var(--ink);
  color:#0B1015;font-family:"Archivo";font-weight:800;font-size:15px;letter-spacing:.02em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
#nextbtn:active{opacity:.8}
#nextbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- overlays ---------- */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.screen.on{display:flex}
.screen h2{font-family:"Archivo";font-weight:900;font-size:clamp(34px,7vw,64px);
  line-height:.94;text-transform:uppercase;margin:0 0 14px}
.screen p{color:var(--dim);max-width:44ch;font-size:16px;line-height:1.5;margin:0 0 26px}
.bigbtn{border:0;border-radius:14px;background:var(--red);color:#fff;font-family:"Archivo";
  font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.03em;padding:17px 34px}
.bigbtn.ghost{background:transparent;border:2px solid var(--faint);color:var(--dim);
  font-size:14px;padding:13px 24px;margin-top:12px}

/* rest overlay */
#rest{position:fixed;inset:0;background:rgba(11,16,21,.96);z-index:30;display:none;
  flex-direction:column;align-items:center;justify-content:center}
#rest.on{display:flex}
#restnum{font-family:"Archivo";font-weight:900;font-size:clamp(90px,26vw,190px);
  line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
#restlbl{font-family:"IBM Plex Mono",monospace;letter-spacing:.2em;font-size:12px;
  color:var(--dim);text-transform:uppercase;margin-bottom:8px}

/* figure styling */
.limb{fill:none;stroke:var(--ink);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.limb.far{opacity:.34}
.torso{fill:var(--ink);fill-opacity:.16;stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.jt{fill:var(--ink);opacity:.85}
.hd{fill:var(--ink)}
.floor{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.mark{stroke:var(--blue);stroke-width:3;stroke-dasharray:9 8;opacity:.55}
.prop{fill:#2A3846;stroke:var(--blue);stroke-width:3}
.ball{fill:var(--red)}
.rope{fill:none;stroke:var(--red);stroke-width:3.4;stroke-linecap:round;opacity:.9}
.zone{fill:var(--red);opacity:.13}
.plbl{font-family:"IBM Plex Mono",monospace;font-size:15px;fill:var(--dim);letter-spacing:.08em}
</style>

<div id="app">
  <div id="top">
    <div id="block">&nbsp;</div>
    <div id="done-badge">&#10003; DONE</div>
    <div id="count">&nbsp;</div>
  </div>

  <div id="main">
    <div id="stage">
      <svg id="svg" viewBox="-22 -46 244 272" preserveAspectRatio="xMidYMid meet"></svg>
      <button id="replay">REPLAY</button>
    </div>

    <div id="info">
      <h1 id="name"></h1>
      <p id="plain"></p>
      <div id="dosebar">
        <div>
          <div id="big" class="disp"></div>
          <div id="sub"></div>
        </div>
        <div id="dots"></div>
        <button id="restbtn">REST 60s</button>
      </div>
      <div class="sec">How to do it</div>
      <ol class="steps" id="steps"></ol>
      <div class="sec">You know it is right when</div>
      <ul class="checks" id="checks"></ul>
      <div class="sec">Watch out for</div>
      <div id="fix"></div>
      <div style="height:20px"></div>
    </div>
  </div>

  <div id="bot">
    <button class="nav" id="prev" aria-label="Previous drill">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="prog">
      <div id="segs"></div>
      <div id="progtxt"><span id="ptl"></span><span id="ptr"></span></div>
    </div>
    <button id="nextbtn">Next <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<!-- start screen -->
<div class="screen on" id="start">
  <h2>Force into<br>the ground</h2>
  <p id="introtxt"></p>
  <button class="bigbtn" id="go">Start with the warm up</button>
  <button class="bigbtn ghost" id="skipprep">Skip to the drills</button>
</div>

<!-- finish screen -->
<div class="screen" id="finish">
  <h2>Session<br>complete</h2>
  <p id="fintxt"></p>
  <button class="bigbtn" id="again">Start over</button>
</div>

<!-- rest overlay -->
<div id="rest">
  <div id="restlbl">Rest</div>
  <div id="restnum" class="disp">60</div>
  <button class="bigbtn ghost" id="restskip">Skip rest</button>
</div>

const DRILLS = [{"block":"Warm up","name":"Jump rope","view":"front","plain":"Three minutes of easy skipping to get your body temperature up. If you would rather ride a bike, ride easy for the same three minutes.","big":"3 min","sub":"easy, nothing hard","dots":1,"rest":0,"props":"rope","seq":[{"p":"f_rope_down","t":190,"arc":1},{"p":"f_rope_up","t":190,"arc":0}],"steps":["Stay on the balls of your feet.","Keep the hops tiny, barely an inch off the floor.","Turn the rope with your wrists, not your whole arms.","Keep it easy. You should be able to hold a conversation the whole time."],"checks":["You are breathing a little harder but could still talk.","The hops stay small and quiet."],"fix":"Do not turn this into a workout. It is here to warm you up and nothing else."},{"block":"Warm up","name":"Ankle rock","view":"side","plain":"From a half kneeling position you drive your front knee forward past your toes. Stiff ankles are one of the most common limits on a skating stride.","big":"6 each","sub":"6 slow rocks per side","dots":2,"rest":0,"seq":[{"p":"s_ankle_back","t":650},{"p":"s_ankle_fwd","t":600,"e":"out"},{"p":"s_ankle_fwd","t":300},{"p":"s_ankle_back","t":600,"e":"in"}],"steps":["Half kneeling, front foot flat on the floor, back knee down.","Keep the front heel glued to the floor.","Drive your front knee forward, out over and past your little toe.","Hold for a beat, come back, repeat. Then switch sides."],"checks":["Your front heel never lifts.","You feel a stretch in the front of the ankle, not a pinch in the joint."],"fix":"If the heel comes up, you went too far. Shorten the range and it will open up faster."},{"block":"Warm up","name":"90-90 hip switch","view":"front","plain":"Sitting on the floor with both knees bent, you rotate both legs from one side to the other. It opens the inside of one hip and the outside of the other at the same time.","big":"6 each","sub":"6 switches per side","dots":1,"rest":0,"seq":[{"p":"f_9090_l","t":620},{"p":"f_9090_mid","t":420},{"p":"f_9090_r","t":620},{"p":"f_9090_mid","t":420}],"steps":["Sit with your hands behind you, knees bent, feet flat on the floor.","Let both knees fall over to one side, keeping them bent at about 90 degrees.","Lift them back through the middle and lower them to the other side.","Go slowly and stay tall through the chest."],"checks":["Your chest stays up rather than collapsing backward.","Both knees move together."],"fix":"If you cannot sit upright, sit on a folded towel or a book. That fixes it immediately."},{"block":"Warm up","name":"Adductor rockback","view":"side","plain":"On your hands and knees with one leg straight out to the side, you rock your hips back toward your heel. This is the groin work that actually carries over to skating.","big":"6 each","sub":"6 rockbacks per side","dots":2,"rest":0,"seq":[{"p":"s_rock_fwd","t":600},{"p":"s_rock_back","t":700,"e":"out"},{"p":"s_rock_back","t":300},{"p":"s_rock_fwd","t":600,"e":"in"}],"steps":["Get on your hands and knees.","Straighten one leg out to the side with the foot flat and the toes pointing forward.","Keep your back flat and rock your hips back toward your heel.","Come forward again. Repeat, then switch sides."],"checks":["Your back stays flat rather than rounding.","You feel it along the inside of the straight leg."],"fix":"Turning the straight foot out takes the stretch off the muscle you are trying to reach. Keep the toes pointing forward."},{"block":"Warm up","name":"Leg swing, front to back","view":"side","plain":"Hand on a wall, you swing one leg forward and back like a pendulum. This is a moving warm up, not a stretch you hold.","big":"10 each","sub":"10 swings per leg","dots":2,"rest":0,"seq":[{"p":"s_swing_back","t":400},{"p":"s_swing_fwd","t":400}],"steps":["Stand tall with one hand on a wall for balance.","Swing one leg forward and back, staying relaxed.","Let the range grow a little with each swing.","Keep your torso still. Only the leg moves."],"checks":["Your upper body stays quiet.", t":1200,"dx":34},{"p":"s_brace","t":260,"dx":34,"fade":1}],"props":"zone","steps":["Mark 15 yards with a cone at the 10.","Sprint flat out all the way to the cone. Do not coast into it.","Past the cone, widen your feet and drop your hips to brake.","Come to a complete stop by the 15 and hold it for two seconds."],"checks":["You stop inside the 5 yard zone without stumbling forward.","Your chest stays up as you brake."],"fix":"Alternate which foot plants last so one side does not get better than the other."},{"block":"Power","name":"Heavy lift, then jump","view":"front","plain":"Three heavy reps of a squat or deadlift, then exactly 60 seconds rest, then three maximum jumps. The heavy lift briefly turns your nervous system up so you jump higher.","big":"3 rounds","sub":"3 heavy reps &rarr; 60s &rarr; 3 jumps","dots":3,"rest":60,"seq":[{"p":"f_tall","t":700},{"p":"f_dip","t":210,"e":"in"},{"p":"f_extend","t":150,"e":"out"},{"p":"f_air","t":190},{"p":"f_land","t":210,"e":"in"},{"p":"f_tall","t":420,"e":"out"}],"steps":["Do 3 reps of a trap bar deadlift or back squat, at a weight you could lift about 6 times before failing.","No barbell? Push against a wall as hard as you possibly can for 5 seconds instead.","Rest 60 seconds. Not less, not more.","Then 3 maximum jumps: dip fast to a quarter squat, swing your arms, jump as high as you can, land soft.","That is one round. Do three."],"checks":["The jumps feel springier than they normally would.","You land quietly every time."],"fix":"Do not go so heavy that your form breaks down. The lift is here to switch your nervous system on, not to set a record."},{"block":"Power","name":"Split squat jump","view":"side","plain":"From a lunge position, jump straight up, switch your legs in the air, and land in the opposite stance.","big":"3 &times; 4","sub":"3 sets of 4 each side","dots":3,"rest":0,"seq":[{"p":"s_split","t":650},{"p":"s_split_dip","t":210,"e":"in"},{"p":"s_split_air","t":230,"e":"out"},{"p":"s_split_land","t":230,"e":"in"},{"p":"s_split_land","t":650}],"steps":["Set up in a split stance: one foot forward, back knee under your hip, chest tall.","Dip quickly, then jump straight up.","Switch your legs in the air.","Land in the mirror image of where you started. Pause and reset before the next one."],"checks":["You land quietly.","Your chest stays tall the whole time, not tipping forward."],"fix":"Do not run these together like jumping jacks. Reset your posture between every rep so each one is a real effort."},{"block":"Power","name":"Med ball scoop throw","view":"side","plain":"Standing side-on to a wall, you whip a medicine ball up into it using your hips, the same way you load a shot.","big":"3 &times; 4","sub":"3 sets of 4 each side","dots":3,"rest":0,"seq":[{"p":"s_mb_load","t":750},{"p":"s_mb_turn","t":190,"e":"out"},{"p":"s_mb_release","t":170,"e":"out"},{"p":"s_mb_release","t":420,"fade":1}],"props":"wall","ballFollow":"hL","steps":["Stand side-on to a solid wall, about six feet away, feet a little wider than your hips.","Hold a 6 to 10 pound ball low at your back hip. Use one that does not bounce back at your face.","Turn your back foot and drive your hip through.","Throw the ball up into the wall as hard as you can. Let it hit high, not straight across."],"checks":["Your back foot pivots, the way it does when you shoot.","The ball hits the wall well above where you released it."],"fix":"If your arms are doing the work, the ball goes nowhere. The throw starts at the back foot and finishes at the hands."},{"block":"Armor","name":"Copenhagen plank","view":"side","plain":"A side plank where your top foot rests on a bench and you squeeze down into it. It is the best groin injury insurance there is.","big":"3 &times; 25s","sub":"3 holds of 20 to 30 seconds each side","dots":3,"rest":0,"seq":[{"p":"s_cop_down","t":800},{"p":"s_cop_up","t":500,"e":"out"},{"p":"s_cop_up","t":1800}],"props":"bench","steps":["Lie on your side with your top foot resting on a bench, chair, or couch.","P  down. Count it out."],"checks":["Your knees stay straight the whole time.","The lowering is slow and even, not a drop."],"fix":"Bouncing through the reps wastes the set. The slow lowering is where the tissue actually gets tougher."}];
const NJ = 16;
const [HEAD,NECK,SL,EL,HL,SR,ER,HR,PL,KL,AL,TL,PR,KR,AR,TR] = [...Array(16).keys()];

/* ---------------- animation engine ---------------- */
const EASE = {
  lin: t=>t,
  in:  t=>t*t,
  out: t=>1-(1-t)*(1-t),
  io:  t=>t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2
};
const lerp=(a,b,u)=>a+(b-a)*u;

function sample(seq, ms){
  const total = seq.reduce((a,f)=>a+f.t,0);
  let u = ((ms % total)+total) % total, i = 0;
  while(u >= seq[i].t){ u -= seq[i].t; i++; if(i>=seq.length){i=0;break;} }
  const A = seq[i], B = seq[(i+1)%seq.length];
  const k = (EASE[A.e] || EASE.io)(A.t ? u/A.t : 0);
  const pa = POSES[A.p], pb = POSES[B.p];
  const pts = new Array(NJ);
  for(let j=0;j<NJ;j++) pts[j] = [lerp(pa[j][0],pb[j][0],k), lerp(pa[j][1],pb[j][1],k)];
  return {
    pts,
    dx:  lerp(A.dx||0, B.dx||0, k),
    dy:  lerp(A.dy||0, B.dy||0, k),
    rot: lerp(A.rot||0, B.rot||0, k),
    arc: lerp(A.arc===undefined?0:A.arc, B.arc===undefined?0:B.arc, k),
    op:  A.fade ? lerp(1,0,k) : (i===0 && seq[seq.length-1].fade ? lerp(0,1,Math.min(1,k*3)) : 1)
  };
}

const NS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const path=(pts,idx)=>'M '+idx.map(i=>pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)).join(' L ');

let SVG, G, E={}, JTS=[], BALL=null, raf=0, t0=0, cur=null;
const JOINT_IDS = [SL,EL,PL,KL,SR,PR,KR];

function buildStage(d){
  SVG.innerHTML='';
  const isSide = d.view === 'side';
  const dxs = d.seq.map(f=>f.dx||0);
  const lo = Math.min(0,...dxs), hi = Math.max(0,...dxs);
  // fixed viewBox height keeps the figure a consistent size across drills
  SVG.setAttribute('viewBox', (lo-22)+' -46 '+(244+hi-lo)+' 272');

  const p = mk('g'); SVG.appendChild(p);
  p.appendChild(mk('line',{x1:lo-30,y1:200,x2:230+hi,y2:200,class:'floor'}));
  if(d.props==='line') p.appendChild(mk('line',{x1:100,y1:200,x2:100,y2:92,class:'mark'}));
  if(d.props==='wall'){
    p.appendChild(mk('rect',{x:198,y:-30,width:20,height:230,class:'prop'}));
    const t=mk('text',{x:192,y:-38,class:'plbl','text-anchor':'end'});t.textContent='WALL';p.appendChild(t);
  }
  if(d.props==='bench'){
    p.appendChild(mk('rect',{x:150,y:126,width:120,height:15,class:'prop'}));
    p.appendChild(mk('line',{x1:158,y1:141,x2:158,y2:200,class:'floor'}));
    p.appendChild(mk('line',{x1:260,y1:141,x2:260,y2:200,class:'floor'}));
  }
  if(d.props==='hold'){
    p.appendChild(mk('line',{x1:130,y1:166,x2:174,y2:166,class:'prop'}));
    p.appendChild(mk('line',{x1:130,y1:196,x2:174,y2:196,class:'prop'}));
    const t=mk('text',{x:180,y:188,class:'plbl'});t.textContent='HELD';p.appendChild(t);
  }
  if(d.props==='zone'){
    p.appendChild(mk('rect',{x:96,y:140,width:150,height:60,class:'zone'}));
    const t=mk('text',{x:100,y:132,class:'plbl'});t.textContent='STOP ZONE';p.appendChild(t);
  }
  if(d.props==='partner'){
    p.appendChild(mk('circle',{cx:176,cy:44,r:9,class:'jt'}));
    p.appendChild(mk('path',{d:'M176 53 V112 M176 66 L162 56 M176 66 L190 60 M176 112 L166 156 L166 200 M176 112 L186 156 L186 200',class:'limb far'}));
  }

  G = mk('g'); SVG.appendChild(G);
  const add=(t,a)=>{const e=mk(t,a);G.appendChild(e);return e;};
  E.legR  = add('path',{class:'limb'+(isSide?' far':'')});
  E.armR  = add('path',{class:'limb'+(isSide?' far':'')});
  E.torso = add('polygon',{class:'torso'});
  E.neck  = add('path',{class:'limb'});
  E.legL  = add('path',{class:'limb'});
  E.armL  = add('path',{class:'limb'});
  JTS = JOINT_IDS.map(()=>add('circle',{r:4.4,class:'jt'}));
  E.head  = add('ellipse',{rx:13,ry:15,class:'hd'});
  BALL = (d.ballFollow || d.ball) ? add('circle',{r:12,class:'ball'}) : null;
  E.rope = (d.props==='rope') ? add('path',{class:'rope'}) : null;
  cur = d;
}

function draw(f){
  const P = f.pts;
  E.torso.setAttribute('points',[SL,SR,PR,PL].map(i=>P[i][0].toFixed(1)+','+P[i][1].toFixed(1)).join(' '));
  E.neck.setAttribute('d', path(P,[NECK,SL]));
  E.armL.setAttribute('d', path(P,[SL,EL,HL]));
  E.armR.setAttribute('d', path(P,[SR,ER,HR]));
  E.legL.setAttribute('d', path(P,[PL,KL,AL,TL]));
  E.legR.setAttribute('d', path(P,[PR,KR,AR,TR]));
  E.head.setAttribute('cx',P[HEAD][0].toFixed(1));
  E.head.setAttribute('cy',P[HEAD][1].toFixed(1));
  JTS.forEach((c,i)=>{const j=JOINT_IDS[i];c.setAttribute('cx',P[j][0].toFixed(1));c.setAttribute('cy',P[j][1].toFixed(1));});
  const piv = cur.pivot || [100,200];
  G.setAttribute('transform','translate('+f.dx.toFixed(1)+' '+f.dy.toFixed(1)+') rotate('+f.rot.toFixed(2)+' '+piv[0]+' '+piv[1]+')');
  G.setAttribute('opacity', f.op.toFixed(2));
  if(E.rope){
    const a=P[HL], b=P[HR], cy = lerp(216,-42,f.arc);
    E.rope.setAttribute('d','M '+a[0].toFixed(1)+' '+a[1].toFixed(1)+' Q '+((a[0]+b[0])/2).toFixed(1)+' '+cy.toFixed(1)+' '+b[0].toFixed(1)+' '+b[1].toFixed(1));
  }
  if(BALL && cur.ballFollow){
    const j = {hL:HL,hR:HR}[cur.ballFollow];
    BALL.setAttribute('cx',(P[j][0]+f.dx).toFixed(1));
    BALL.setAttribute('cy',(P[j][1]+f.dy).toFixed(1));
    BALL.setAttribute('opacity', f.op.toFixed(2));
  }
}

function ballTrack(track, ms){
  const total = track.reduce((a,s)=>a+s[2],0);
  let u = ms % total, i=0;
  while(u >= track[i][2]){ u -= track[i][2]; i++; if(i>=track.length){i=0;break;} }
  const A=track[i], B=track[(i+1)%track.length], k=A[2]?u/A[2]:0;
  return [lerp(A[0],B[0],k), lerp(A[1],B[1],k)];
}

function loop(ts){
  if(!t0) t0 = ts;
  const f = sample(cur.seq, ts - t0);
  draw(f);
  if(BALL && cur.ball){
    const b = ballTrack(cur.ball.track, ts - t0);
    BALL.setAttribute('cx',b[0].toFixed(1)); BALL.setAttribute('cy',b[1].toFixed(1));
  }
  raf = requestAnimationFrame(loop);
}
function play(d){ cancelAnimationFrame(raf); buildStage(d); t0=0; raf=requestAnimationFrame(loop); }

/* ---------------- app state ---------------- */
const S = { i:0, sets: DRILLS.map(()=>0) };
const $ = id => document.getElementById(id);
const isDone = i => S.sets[i] >= DRILLS[i].dots;
const nDone  = () => S.sets.reduce((a,_,i)=>a+(isDone(i)?1:0),0);

function renderSegs(){
  const s = $('segs'); s.innerHTML='';
  DRILLS.forEach((_,i)=>{
    const e = document.createElement('div');
    e.className = 'seg' + (isDone(i)?' done':'') + (i===S.i?' cur':'');
    s.appendChild(e);
  });
  $('ptl').textContent = nDone()+' of '+DRILLS.length+' done';
  $('ptr').textContent = 'Drill '+(S.i+1);
}

function render(){
  const d = DRILLS[S.i];
  $('block').textContent = d.block;
  $('count').textContent = (S.i+1)+' / '+DRILLS.length;
  $('name').textContent = d.name;
  $('plain').textContent = d.plain;
  $('big').innerHTML = d.big;
  $('sub').innerHTML = d.sub;
  $('steps').innerHTML = d.steps.map(s=>'<li>'+s+'</li>').join('');
  $('checks').innerHTML = d.checks.map(s=>'<li>'+s+'</li>').join('');
  $('fix').textContent = d.fix;
  $('info').scrollTop = 0;

  const dots = $('dots'); dots.innerHTML='';
  for(let k=0;k<d.dots;k++){
    const b = document.createElement('button');
    b.className = 'dot' + (k < S.sets[S.i] ? ' on' : '');
    b.textContent = k+1;
    b.onclick = ()=>{
      S.sets[S.i] = (k < S.sets[S.i]) ? k : k+1;
      if(k >= S.sets[S.i]-1 && d.rest) startRest(d.rest);
      render();
    };
    dots.appendChild(b);
  }
  const rb = $('restbtn');
  rb.className = d.rest ? '' : 'hide';
  rb.textContent = 'REST '+d.rest+'s';
  rb.onclick = ()=>startRest(d.rest);

  $('done-badge').className = isDone(S.i) ? 'on' : '';
  $('prev').disabled = S.i===0;
  $('nextbtn').firstChild.textContent = (S.i===DRILLS.length-1) ? 'Finish ' : 'Next ';
  renderSegs();
  play(d);
}

function go(n){
  if(n >= DRILLS.length){
    $('fintxt').textContent = nDone()+' of '+DRILLS.length+
      ' drills completed. Log your standing broad jump every three weeks. If it is not moving, look at sleep and food before you change the program.';
    $('finish').classList.add('on'); return;
  }
  S.i = Math.max(0, Math.min(DRILLS.length-1, n));
  render();
}

/* ---------------- rest timer ---------------- */
let rt=0;
function startRest(sec){
  if(!sec) return;
  let left = sec;
  $('restnum').textContent = left;
  $('rest').classList.add('on');
  clearInterval(rt);
  rt = setInterval(()=>{
    left--;
    $('restnum').textContent = Math.max(0,left);
    if(left<=0){ clearInterval(rt); $('rest').classList.remove('on'); beep(); }
  },1000);
}
$('restskip').onclick = ()=>{ clearInterval(rt); $('rest').classList.remove('on'); };

let actx=null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination); o.frequency.value=760; o.type='square';
    g.gain.setValueAtTime(.18,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.35);
    o.start(); o.stop(actx.currentTime+.36);
  }catch(e){}
}

/* ---------------- keep the screen awake ---------------- */
let wl=null;
async function wake(){
  try{ if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });

/* ---------------- controls ---------------- */
$('prev').onclick = ()=>go(S.i-1);
$('nextbtn').onclick = ()=>go(S.i+1);
$('replay').onclick = ()=>{ t0=0; };
const FIRST_DRILL = DRILLS.findIndex(d=>d.block!=='Warm up');
$('go').onclick = ()=>{ $('start').classList.remove('on'); wake(); beepInit(); go(0); };
$('skipprep').onclick = ()=>{ $('start').classList.remove('on'); wake(); beepInit(); go(FIRST_DRILL); };
$('again').onclick = ()=>{ S.sets = DRILLS.map(()=>0); $('finish').classList.remove('on'); go(0); };
function beepInit(){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }

// swipe between drills
let sx=0, sy=0;
$('main').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$('main').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6) go(S.i + (dx<0?1:-1));
},{passive:true});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(S.i+1);
  if(e.key==='ArrowLeft')  go(S.i-1);
});

$('introtxt').textContent = DRILLS.length+' movements, about an hour. The first '+
  DRILLS.filter(d=>d.block==='Warm up').length+' are the warm up. Every rep after that is maximum effort or it does not count.';
SVG = $('svg');
render();
</script>
</html>
