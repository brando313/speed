<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hockey Speed Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1015; --panel:#141C25; --stage:#1A242F;
  --ink:#EEF4FA; --dim:#93A5B6; --faint:#4A5B6B;
  --blue:#4D9BFF; --red:#FF3B4E; --green:#31D07A;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.disp{font-family:"Archivo",system-ui,sans-serif;letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#top{
  display:flex;align-items:center;gap:12px;padding:14px 20px 10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));flex:0 0 auto;
}
#block{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--red);font-weight:600;
}
#count{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim)}
#done-badge{
  display:none;align-items:center;gap:5px;color:var(--green);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;font-weight:600;
}
#done-badge.on{display:flex}

/* ---------- main ---------- */
#main{flex:1 1 auto;min-height:0;display:grid;gap:16px;padding:0 20px 8px;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
@media (max-aspect-ratio:1/1){
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr)}
}
#stage{
  background:var(--stage);border-radius:14px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:0;
}
#stage svg{width:100%;height:100%;display:block}
#replay{
  position:absolute;right:10px;bottom:10px;background:rgba(11,16,21,.72);color:var(--dim);
  border:1px solid var(--faint);border-radius:9px;padding:8px 12px;font-size:11px;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;
}
#info{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px}
#info::-webkit-scrollbar{width:0}

h1{font-family:"Archivo";font-weight:900;font-size:clamp(24px,3.4vw,36px);
   line-height:1;text-transform:uppercase;margin:0 0 8px}
#plain{color:var(--dim);font-size:15px;line-height:1.45;margin:0 0 16px}

.sec{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
     text-transform:uppercase;color:var(--faint);font-weight:600;margin:16px 0 7px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:11px;margin:0 0 9px;font-size:15px;line-height:1.4}
ol.steps li:before{
  content:counter(s);flex:0 0 auto;width:21px;height:21px;border-radius:50%;
  background:var(--red);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
ul.checks{margin:0;padding:0;list-style:none}
ul.checks li{display:flex;gap:10px;font-size:14.5px;line-height:1.4;margin:0 0 7px;color:var(--ink)}
ul.checks li:before{content:"";flex:0 0 auto;width:8px;height:8px;margin-top:7px;
  border-radius:2px;background:var(--green)}
#fix{border-left:3px solid var(--red);padding:2px 0 2px 12px;margin:14px 0 4px;
  font-size:14.5px;font-style:italic;line-height:1.4;color:var(--dim)}

/* ---------- dose + sets ---------- */
#dosebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--panel);border-radius:14px;padding:14px 16px;margin:0 0 4px}
#big{font-family:"Archivo";font-weight:900;font-size:30px;line-height:1;white-space:nowrap}
#sub{font-size:12.5px;color:var(--dim);line-height:1.3;flex:1 1 120px;min-width:110px}
#dots{display:flex;gap:9px;margin-left:auto}
.dot{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--faint);
  background:transparent;color:var(--faint);font-family:"IBM Plex Mono",monospace;
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,background .12s ease,border-color .12s ease;
}
.dot:active{transform:scale(.9)}
.dot.on{background:var(--green);border-color:var(--green);color:#06210F}
#restbtn{
  border:2px solid var(--blue);color:var(--blue);background:transparent;border-radius:10px;
  padding:9px 14px;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  letter-spacing:.06em;white-space:nowrap;
}
#restbtn.run{background:var(--blue);color:#04121F}
#restbtn.hide{display:none}

/* ---------- bottom ---------- */
#bot{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:12px 20px calc(14px + var(--safe-b));border-top:1px solid #1E2833}
.nav{
  width:52px;height:52px;flex:0 0 auto;border-radius:13px;border:1px solid #2A3644;
  background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;
}
.nav:disabled{opacity:.3}
.nav:active{background:#1C2732}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
#prog{flex:1 1 auto;min-width:0}
#segs{display:flex;gap:3px;height:9px}
.seg{flex:1 1 0;border-radius:2px;background:#242F3B;transition:background .2s ease}
.seg.done{background:var(--green)}
.seg.cur{background:var(--red)}
#progtxt{display:flex;justify-content:space-between;margin-top:7px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.06em}
#nextbtn{
  height:52px;flex:0 0 auto;padding:0 20px;border-radius:13px;border:0;background:var(--ink);
  color:#0B1015;font-family:"Archivo";font-weight:800;font-size:15px;letter-spacing:.02em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
#nextbtn:active{opacity:.8}
#nextbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- overlays ---------- */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.screen.on{display:flex}
.screen h2{font-family:"Archivo";font-weight:900;font-size:clamp(34px,7vw,64px);
  line-height:.94;text-transform:uppercase;margin:0 0 14px}
.screen p{color:var(--dim);max-width:44ch;font-size:16px;line-height:1.5;margin:0 0 26px}
.bigbtn{border:0;border-radius:14px;background:var(--red);color:#fff;font-family:"Archivo";
  font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.03em;padding:17px 34px}
.bigbtn.ghost{background:transparent;border:2px solid var(--faint);color:var(--dim);
  font-size:14px;padding:13px 24px;margin-top:12px}

/* rest overlay */
#rest{position:fixed;inset:0;background:rgba(11,16,21,.5);z-index:30;display:none;
  flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#rest.on{display:flex}
#restpanel{background:rgba(11,16,21,.94);border:1px solid #2A3644;border-radius:20px;
  padding:16px 30px 20px;text-align:center;min-width:min(320px,92vw)}
#restnum{font-family:"Archivo";font-weight:900;font-size:clamp(56px,13vw,92px);
  line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}
#restnext{color:var(--dim);font-size:14px;margin:8px 0 14px;line-height:1.4}
#restnext b{color:var(--ink)}
#restlbl{font-family:"IBM Plex Mono",monospace;letter-spacing:.2em;font-size:12px;
  color:var(--dim);text-transform:uppercase;margin-bottom:8px}

/* figure styling */
.limb{fill:none;stroke:var(--ink);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.limb.far{opacity:.34}
.torso{fill:var(--ink);fill-opacity:.16;stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.jt{fill:var(--ink);opacity:.85}
.hd{fill:var(--ink)}
.floor{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.mark{stroke:var(--blue);stroke-width:3;stroke-dasharray:9 8;opacity:.55}
.prop{fill:#2A3846;stroke:var(--blue);stroke-width:3}
.ball{fill:var(--red)}
.lane{stroke:var(--faint);stroke-width:2;stroke-dasharray:7 6}
.zig{fill:none;stroke:var(--red);stroke-width:3.4;stroke-linejoin:round;stroke-linecap:round}
.zigarrow{fill:none;stroke:var(--red);stroke-width:3.4;stroke-linecap:round;marker-end:url(#zag)}
.footdot{fill:var(--stage);stroke:var(--ink);stroke-width:2.4}
.startdot{fill:var(--stage);stroke:var(--green);stroke-width:2.4}
.footlbl{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;fill:var(--ink)}
.meas{stroke:var(--dim);stroke-width:2.4;stroke-linecap:round;opacity:.75}
.zone{fill:var(--red);opacity:.14}
.lblr{font-family:"IBM Plex Mono",monospace;font-size:15px;fill:var(--red);letter-spacing:.08em}
.biglbl{font-family:"Archivo";font-weight:900;font-size:22px;fill:var(--ink);letter-spacing:.02em}
.rope{fill:none;stroke:var(--red);stroke-width:3.4;stroke-linecap:round;opacity:.9}
.zone{fill:var(--red);opacity:.13}
.plbl{font-family:"IBM Plex Mono",monospace;font-size:15px;fill:var(--dim);letter-spacing:.08em}
</style>

<div id="app">
  <div id="top">
    <div id="block">&nbsp;</div>
    <div id="done-badge">&#10003; DONE</div>
    <div id="count">&nbsp;</div>
  </div>

  <div id="main">
    <div id="stage">
      <svg id="svg" viewBox="-22 -46 244 272" preserveAspectRatio="xMidYMid meet"><defs><marker id="zag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FF3B4E"/></marker></defs></svg>
      <button id="replay">REPLAY</button>
    </div>

    <div id="info">
      <h1 id="name"></h1>
      <p id="plain"></p>
      <div id="dosebar">
        <div>
          <div id="big" class="disp"></div>
          <div id="sub"></div>
        </div>
        <div id="dots"></div>
        <button id="restbtn">REST 60s</button>
      </div>
      <div class="sec">How to do it</div>
      <ol class="steps" id="steps"></ol>
      <div class="sec">You know it is right when</div>
      <ul class="checks" id="checks"></ul>
      <div class="sec">Watch out for</div>
      <div id="fix"></div>
      <div style="height:20px"></div>
    </div>
  </div>

  <div id="bot">
    <button class="nav" id="prev" aria-label="Previous drill">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="prog">
      <div id="segs"></div>
      <div id="progtxt"><span id="ptl"></span><span id="ptr"></span></div>
    </div>
    <button id="nextbtn">Next <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<!-- start screen -->
<div class="screen on" id="start">
  <h2>Force into<br>the ground</h2>
  <p id="introtxt"></p>
  <button class="bigbtn" id="go">Start with the warm up</button>
  <button class="bigbtn ghost" id="skipprep">Skip to the drills</button>
</div>

<!-- finish screen -->
<div class="screen" id="finish">
  <h2>Session<br>complete</h2>
  <p id="fintxt"></p>
  <button class="bigbtn" id="again">Start over</button>
</div>

<!-- rest overlay -->
<div id="rest">
  <div id="restpanel">
    <div id="restlbl">Rest</div>
    <div id="restnum" class="disp">60</div>
    <div id="restnext"></div>
    <button class="bigbtn ghost" id="restskip" style="margin-top:0">Skip rest</button>
  </div>
</div>

const DRILLS = [{"block":"Warm up","name":"Jog or jump rope","view":"front","plain":"Three minutes of easy jogging or easy skipping to get your body temperature up. Either one works, so take whichever you have the room and the gear for.","big":"3 min","sub":"easy, nothing hard","dots":1,"rest":0,"timer":180,"figs":[{"view":"side","ox":-66,"cap":"JOG","seq":[{"p":"s_run","t":250},{"p":"s_run_b","t":250}]},{"view":"front","ox":66,"cap":"OR JUMP ROPE","rope":true,"seq":[{"p":"f_rope_down","t":190,"arc":1},{"p":"f_rope_up","t":190,"arc":0}]}],"steps":["Pick one. Jogging is easier on the calves, skipping is quicker to set up.","Stay on the balls of your feet and keep everything small and relaxed.","If you are skipping, turn the rope with your wrists rather than your whole arms.","Keep it easy enough that you could hold a conversation the whole time."],"checks":["You are breathing a little harder but could still talk.","Nothing is burning yet."],"fix":"Do not turn this into a workout. It is here to warm you up and nothing else."},{"block":"Warm up","name":"Ankle rock","view":"side","plain":"From a half kneeling position you drive your front knee forward past your toes. Stiff ankles are one of the most common limits on a skating stride.","big":"6 each","sub":"6 slow rocks per side","dots":2,"rest":0,"seq":[{"p":"s_ankle_back","t":650},{"p":"s_ankle_fwd","t":600,"e":"out"},{"p":"s_ankle_fwd","t":300},{"p":"s_ankle_back","t":600,"e":"in"}],"steps":["Half kneeling, front foot flat on the floor, back knee down.","Keep the front heel glued to the floor.","Drive your front knee forward, out over and past your little toe.","Hold for a beat, come back, repeat. Then switch sides."],"checks":["Your front heel never lifts.","You feel a stretch in the front of the ankle, not a pinch in the joint."],"fix":"If the heel comes up, you went too far. Shorten the range and it will open up faster."},{"block":"Warm up","name":"90-90 hip switch","view":"front","plain":"Sit on the floor with both knees bent to 90 degrees, one leg folded in front of you and the other folded behind. You sweep both legs across to the other side, then back.","big":"6 each","sub":"6 switches per side","dots":1,"rest":0,"seq":[{"p":"f_9090_l","t":700},{"p":"f_9090_mid","t":460},{"p":"f_9090_r","t":700},{"p":"f_9090_mid","t":460}],"steps":["Sit on the floor with your front knee out to one side and that shin folded across in front of you.","The back leg mirrors it: knee out the other way, shin running behind you. Both knees at about 90 degrees.","Lift both knees and rotate them across to the other side, so the front leg becomes the back leg.","Lower into the shape on that side, then sweep back. Both knees move together."],"checks":["Both knees stay bent at about 90 degrees the whole time.","Your chest stays up rather than collapsing backward.","Neither leg leads. They rotate as a pair."],"fix":"If you cannot sit upright, sit on a folded towel or a book, or put your hands on the floor behind you. Both fix it immediately."},{"block":"Warm up","name":"Adductor rockback","view":"front","plain":"On your hands and knees with one leg straight out to the side, you sit your hips back toward your heel and return. This is the groin work that actually carries over to skating.","big":"6 each","sub":"6 rockbacks per side","dots":2,"rest":0,"seq":[{"p":"s_rock_fwd","t":600},{"p":"s_rock_back","t":700,"e":"out"},{"p":"s_rock_back","t":300},{"p":"s_rock_fwd","t":600,"e":"in"}],"steps":["Get on your hands and knees with your hands under your shoulders.","Straighten one leg out to the side, foot flat on the floor, toes pointing forward.","Keeping that leg straight and your back flat, sit your hips back toward your heel.","Rock forward again. Your hands, your kneeling knee and that far foot never move. Then switch sides."],"checks":["The extended leg stays completely straight the whole time.","Your back stays flat rather than rounding.","You feel it along the inside of the straight leg."],"fix":"Turning the extended foot out takes the stretch off the muscle you are after. Keep the toes forward, and only sit back as far as you can go without that knee bending."},{"block":"Warm up","name":"Leg swing, front to back","view":"side","plain":"Hand on a wall, you swing one leg forward and back like a pendulum. This is a moving warm up, not a stretch you hold.","big":"10 each","sub":"10 swings per leg","dots":2,"rest":0,"seq":[{"p":"s_swing_back","t":400},{"p":"s_swing_fwd","t":400}],"steps":["Stand tall with one hand on a wall for balance.","Swing one leg forward and back, staying relaxed.","Let the range grow a little with each swing.","Keep your torso still. Only the leg moves."],"checks":["Your upper body stays quiet.","The range is bigger on the tenth swing than the first."],"fix":"Do not force height on the early swings. Start small and let it open up."},{"block":"Warm up","name":"Leg swing, side to side","view":"front","plain":"The same idea, but the leg swings across the front of your body and then back out to the side.","big":"10 each","sub":"10 swings per leg","dots":2,"rest":0,"seq":[{"p":"f_swing_in","t":400},{"p":"f_swing_out","t":400}],"steps":["Face a wall with both hands on it.","Swing one leg across the front of your body, then back out to the side.","Stay tall and keep your hips square to the wall.","Ten swings, then switch legs."],"checks":["Your hips stay facing the wall.","The swing feels loose rather than forced."],"fix":"If you are leaning sideways to get more range, you have gone past what is useful here."},{"block":"Warm up","name":"Ankle pogo","view":"front","plain":"A small, stiff bounce on the balls of your feet with your knees almost straight, like you are a pogo stick.","big":"3 &times; 10","sub":"3 sets of 10 bounces","dots":3,"rest":0,"seq":[{"p":"f_ball","t":90,"e":"out"},{"p":"f_ext","t":80,"e":"out"},{"p":"f_air","t":170,"e":"in"}],"steps":["Stand tall, feet under your hips, arms bent at your sides.","Bounce off the balls of your feet. const NJ = 16;
const [HEAD,NECK,SL,EL,HL,SR,ER,HR,PL,KL,AL,TL,PR,KR,AR,TR] = [...Array(16).keys()];

/* ---------------- animation engine ---------------- */
const EASE = {
  lin: t=>t,
  in:  t=>t*t,
  out: t=>1-(1-t)*(1-t),
  io:  t=>t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2
};
const lerp=(a,b,u)=>a+(b-a)*u;

function sample(seq, ms){
  const total = seq.reduce((a,f)=>a+f.t,0);
  let u = ((ms % total)+total) % total, i = 0;
  while(u >= seq[i].t){ u -= seq[i].t; i++; if(i>=seq.length){i=0;break;} }
  const A = seq[i], B = seq[(i+1)%seq.length];
  const k = (EASE[A.e] || EASE.io)(A.t ? u/A.t : 0);
  const pa = POSES[A.p], pb = POSES[B.p];
  const pts = new Array(NJ);
  for(let j=0;j<NJ;j++) pts[j] = [lerp(pa[j][0],pb[j][0],k), lerp(pa[j][1],pb[j][1],k)];
  return {
    pts,
    dx:  lerp(A.dx||0, B.dx||0, k),
    dy:  lerp(A.dy||0, B.dy||0, k),
    rot: lerp(A.rot||0, B.rot||0, k),
    arc: lerp(A.arc===undefined?0:A.arc, B.arc===undefined?0:B.arc, k),
    lab: A.lab||null,
    op:  A.fade ? lerp(1,0,k) : (seq[(i-1+seq.length)%seq.length].fade ? lerp(0,1,Math.min(1,k*3)) : 1)
  };
}

    T(-4,222,'plbl','EVERY LANDING IS ON ONE LEG. S = START.');
  }
  if(d.props==='meter'){                     // 20 yard measure under the runner
    const x0=lo+70, x1=hi+130;
    p.appendChild(mk('line',{x1:x0,y1:216,x2:x1,y2:216,class:'meas'}));
    for(let i=0;i<=4;i++){
      const x=x0+(x1-x0)*i/4;
      p.appendChild(mk('line',{x1:x,y1:210,x2:x,y2:222,class:'meas'}));
      T(x,238,'plbl',(i*5)+(i===4?' YD':''),'middle');
    }
  }
  if(d.props==='zone'){                      // sprint lane then the braking zone
    const x0=lo+60, xb=hi+40, x1=hi+150;
    p.appendChild(mk('line',{x1:x0,y1:216,x2:xb,y2:216,class:'meas'}));
    p.appendChild(mk('rect',{x:xb,y:150,width:x1-xb,height:50,class:'zone'}));
    p.appendChild(mk('line',{x1:xb,y1:150,x2:xb,y2:216,class:'mark'}));
    T((x0+xb)/2,238,'plbl','10 YD SPRINT','middle');
    T((xb+x1)/2,238,'lblr','5 YD TO STOP','middle');
    T(x0,208,'plbl','START');
  }

  FIGS = figs.map(f=>{
    const g=mk('g'); SVG.appendChild(g);
    const isSide = f.view==='side';
    const add=(t,a)=>{const e=mk(t,a);g.appendChild(e);return e;};
    const o={g:g, seq:f.seq, ox:f.ox||0, pivot:f.pivot||d.pivot||[100,200]};
    o.legR=add('path',{class:'limb'+(isSide?' far':'')});
    o.armR=add('path',{class:'limb'+(isSide?' far':'')});
    o.torso=add('polygon',{class:'torso'});
    o.neck=add('path',{class:'limb'});
    o.legL=add('path',{class:'limb'});
    o.armL=add('path',{class:'limb'});
    o.jts=JOINT_IDS.map(()=>add('circle',{r:4.4,class:'jt'}));
    o.head=add('ellipse',{rx:13,ry:15,class:'hd'});
    if(f.rope) o.rope=add('path',{class:'rope'});
    if(f.cap) T(100+(f.ox||0),238,'plbl',f.cap,'middle');
    return o;
  });
  BALL = (d.ballFollow||d.ball||d.ballThrow) ? SVG.appendChild(mk('circle',{r:12,class:'ball'})) : null;
  THROW = null;
  if(d.ballThrow){
    const q = figs[0].seq, tot = q.reduce((a,f)=>a+f.t,0);
    const r = sample(q, d.ballThrow.release);          // where the hand is at the instant of release
    THROW = {tot:tot, from:[r.pts[HL][0]+r.dx, r.pts[HL][1]+r.dy]};
  }
  LABEL = d.labels ? SVG.appendChild(mk('text',{x:(lo+hi)/2+100,y:-24,class:'biglbl','text-anchor':'middle'})) : null;
  cur=d;
}

function drawFig(o,f){
  const P=f.pts;
  o.torso.setAttribute('points',[SL,SR,PR,PL].map(i=>P[i][0].toFixed(1)+','+P[i][1].toFixed(1)).join(' '));
  o.neck.setAttribute('d',pathOf(P,[NECK,SL]));
  o.armL.setAttribute('d',pathOf(P,[SL,EL,HL]));
  o.armR.setAttribute('d',pathOf(P,[SR,ER,HR]));
  o.legL.setAttribute('d',pathOf(P,[PL,KL,AL,TL]));
  o.legR.setAttribute('d',pathOf(P,[PR,KR,AR,TR]));
  o.head.setAttribute('cx',P[HEAD][0].toFixed(1)); o.head.setAttribute('cy',P[HEAD][1].toFixed(1));
  o.jts.forEach((c,i)=>{const j=JOINT_IDS[i];c.setAttribute('cx',P[j][0].toFixed(1));c.setAttribute('cy',P[j][1].toFixed(1));});
  o.g.setAttribute('transform','translate('+(o.ox+f.dx).toFixed(1)+' '+f.dy.toFixed(1)+
    ') rotate('+f.rot.toFixed(2)+' '+o.pivot[0]+' '+o.pivot[1]+')');
  o.g.setAttribute('opacity',f.op.toFixed(2));
  if(o.rope){
    const a=P[HL], b=P[HR], cy=lerp(216,-42,f.arc);
    o.rope.setAttribute('d','M '+a[0].toFixed(1)+' '+a[1].toFixed(1)+' Q '+((a[0]+b[0])/2).toFixed(1)+
      ' '+cy.toFixed(1)+' '+b[0].toFixed(1)+' '+b[1].toFixed(1));
  }
}

function ballTrack(track, ms){
  const total = track.reduce((a,s)=>a+s[2],0);
  let u = ms % total, i=0;
  while(u >= track[i][2]){ u -= track[i][2]; i++; if(i>=track.length){i=0;break;} }
  const A=track[i], B=track[(i+1)%track.length], k=A[2]?u/A[2]:0;
  return [lerp(A[0],B[0],k), lerp(A[1],B[1],k)];
}

function loop(ts){
  if(!t0) t0 = ts;
  const ms = ts - t0;
  let first=null;
  FIGS.forEach(o=>{ const f=sample(o.seq,ms); drawFig(o,f); if(!first) first=f; });
  if(LABEL && first) LABEL.textContent = first.lab || '';
  if(BALL){
    if(cur.ballThrow && THROW && first){
      const R=cur.ballThrow, tc=((ms%THROW.tot)+THROW.tot)%THROW.tot;
      let bx,by,op=1;
      if(tc < R.release){                       // still in the hands
        bx=first.pts[HL][0]+first.dx; by=first.pts[HL][1]+first.dy;
      }else{
        const u=Math.min(1,(tc-R.release)/R.flight);
        bx=lerp(THROW.from[0],R.to[0],u);
        by=lerp(THROW.from[1],R.to[1],u) - Math.sin(u*Math.PI)*(R.lift||8);
        if(u>=1) op=Math.max(0, 1-(tc-R.release-R.flight)/220);   // thuds into the wall and is gone
      }
      BALL.setAttribute('cx',bx.toFixed(1)); BALL.setAttribute('cy',by.toFixed(1));
      BALL.setAttribute('opacity',op.toFixed(2));
    }
    else if(cur.ball){ const b=ballTrack(cur.ball.track,ms);
      BALL.setAttribute('cx',b[0].toFixed(1)); BALL.setAttribute('cy',b[1].toFixed(1)); }
    else if(cur.ballFollow && first){
      const j={hL:HL,hR:HR}[cur.ballFollow];
      BALL.setAttribute('cx',(first.pts[j][0]+first.dx).toFixed(1));
      BALL.setAttribute('cy',(first.pts[j][1]+first.dy).toFixed(1));
      BALL.setAttribute('opacity',first.op.toFixed(2));
    }
  }
  raf = requestAnimationFrame(loop);
}
function play(d){ cancelAnimationFrame(raf); buildStage(d); t0=0;
  $('replay').style.display = FIGS.length ? '' : 'none';
  if(FIGS.length) raf=requestAnimationFrame(loop); }

/* ---------------- app state ---------------- */
const S = { i:0, sets: DRILLS.map(()=>0) };
const $ = id => document.getElementById(id);
const isDone = i => S.sets[i] >= DRILLS[i].dots;
const nDone  = () => S.sets.reduce((a,_,i)=>a+(isDone(i)?1:0),0);

function renderSegs(){
  const s = $('segs'); s.innerHTML='';
  DRILLS.forEach((_,i)=>{
    const e = document.createElement('div');
    e.className = 'seg' + (isDone(i)?' done':'') + (i===S.i?' cur':'');
    s.appendChild(e);
  });
  $('ptl').textContent = nDone()+' of '+DRILLS.length+' done';
  $('ptr').textContent = 'Drill '+(S.i+1);
}

function render(){
  const d = DRILLS[S.i];
  $('block').textContent = d.block;
  $('count').textContent = (S.i+1)+' / '+DRILLS.length;
  $('name').textContent = d.name;
  $('plain').textContent = d.plain;
  $('big').innerHTML = d.big;
  $('sub').innerHTML = d.sub;
  $('steps').innerHTML = d.steps.map(s=>'<li>'+s+'</li>').join('');
  $('checks').innerHTML = d.checks.map(s=>'<li>'+s+'</li>').join('');
  $('fix').textContent = d.fix;
  $('info').scrollTop = 0;

  const dots = $('dots'); dots.innerHTML='';
  for(let k=0;k<d.dots;k++){
    const b = document.createElement('button');
    b.className = 'dot' + (k < S.sets[S.i] ? ' on' : '');
    b.textContent = k+1;
    b.onclick = ()=>{
      const before = isDone(S.i);
      S.sets[S.i] = (k < S.sets[S.i]) ? k : k+1;
      const justFinished = !before && isDone(S.i);
      if(k >= S.sets[S.i]-1 && d.rest){
        if(justFinished && S.i < DRILLS.length-1){
          S.i++; S.ex=0; render();
          const n=DRILLS[S.i];
          startRest(d.rest, 'Next up<br><b>'+n.name+'</b><br>'+n.big.replace(/&[a-z]+;/g,' ')+' \u00b7 '+n.block);
          return;
        }
        startRest(d.rest, 'Still on<br><b>'+d.name+'</b>');
      }
      render();
    };
    dots.appendChild(b);
  }
  const rb = $('restbtn');
  if(d.timer){
    rb.className=''; rb.textContent='START '+Math.floor(d.timer/60)+':'+String(d.timer%60).padStart(2,'0');
    rb.onclick=()=>startRest(d.timer,'<b>'+d.name+'</b>','Timer');
    $('done-badge').className = isDone(S.i) ? 'on' : '';
    $('prev').disabled = S.i===0;
    $('nextbtn').firstChild.textContent = (S.i===DRILLS.length-1) ? 'Finish ' : 'Next ';
    renderSegs(); play(d); return;
  }
  rb.className = d.rest ? '' : 'hide';
  rb.textContent = 'REST '+d.rest+'s';
  rb.onclick = ()=>startRest(d.rest, 'Still on<br><b>'+d.name+'</b>');

  $('done-badge').className = isDone(S.i) ? 'on' : '';
  $('prev').disabled = S.i===0;
  $('nextbtn').firstChild.textContent = (S.i===DRILLS.length-1) ? 'Finish ' : 'Next ';
  renderSegs();
  play(d);
}

function go(n){
  if(n >= DRILLS.length){
    $('fintxt').textContent = nDone()+' of '+DRILLS.length+
      ' drills completed. Log your standing broad jump every three weeks. If it is not moving, look at sleep and food before you change the program.';
    $('finish').classList.add('on'); return;
  }
  S.i = Math.max(0, Math.min(DRILLS.length-1, n));
  render();
}

/* ---------------- rest timer ---------------- */
let rt=0;
function startRest(sec, nextHtml, label){
  if(!sec) return;
  let left = sec;
  $('restlbl').textContent = label || 'Rest';
  $('restnext').innerHTML = nextHtml || '';
  $('restnum').textContent = left>=60 ? Math.floor(left/60)+':'+String(left%60).padStart(2,'0') : left;
  $('rest').classList.add('on');
  clearInterval(rt);
  rt = setInterval(()=>{
    left--;
    const L=Math.max(0,left);
    $('restnum').textContent = L>=60 ? Math.floor(L/60)+':'+String(L%60).padStart(2,'0') : L;
    if(left<=0){ clearInterval(rt); $('rest').classList.remove('on'); beep(); }
  },1000);
}
$('restskip').onclick = ()=>{ clearInterval(rt); $('rest').classList.remove('on'); };

let actx=null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination); o.frequency.value=760; o.type='square';
    g.gain.setValueAtTime(.18,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.35);
    o.start(); o.stop(actx.currentTime+.36);
  }catch(e){}
}

/* ---------------- keep the screen awake ---------------- */
let wl=null;
async function wake(){
  try{ if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });

/* ---------------- controls ---------------- */
$('prev').onclick = ()=>go(S.i-1);
$('nextbtn').onclick = ()=>go(S.i+1);
$('replay').onclick = ()=>{ t0=0; };
const FIRST_DRILL = DRILLS.findIndex(d=>d.block!=='Warm up');
$('go').onclick = ()=>{ $('start').classList.remove('on'); wake(); beepInit(); go(0); };
$('skipprep').onclick = ()=>{ $('start').classList.remove('on'); wake(); beepInit(); go(FIRST_DRILL); };
$('again').onclick = ()=>{ S.sets = DRILLS.map(()=>0); $('finish').classList.remove('on'); go(0); };
function beepInit(){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }

// swipe between drills
let sx=0, sy=0;
$('main').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
$('main').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6) go(S.i + (dx<0?1:-1));
},{passive:true});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(S.i+1);
  if(e.key==='ArrowLeft')  go(S.i-1);
});

$('introtxt').textContent = DRILLS.length+' movements, about an hour. The first '+
  DRILLS.filter(d=>d.block==='Warm up').length+' are the warm up. Every rep after that is maximum effort or it does not count.';
SVG = $('svg');
render();
</script>
</html>
